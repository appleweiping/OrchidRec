name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install package
        run: uv sync --locked
      - name: Compile source
        run: uv run --locked python -m compileall -q src tests tools examples
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Run installed CLI smoke test
        run: uv run --locked orchidrec demo --output-dir artifacts/ci-demo
      - name: Validate local RecBole interaction interchange
        run: >-
          uv run --locked orchidrec dataset-summary
          examples/recbole-synthetic.inter --format recbole-inter --minimum-rating 4
      - name: Validate local RecBole side-feature interchange
        run: >-
          uv run --locked orchidrec import-recbole-features
          --user examples/recbole-side-synthetic.user
          --item examples/recbole-side-synthetic.item
          --output artifacts/ci-recbole-side.json
      - name: Validate local RecBole knowledge interchange
        run: >-
          uv run --locked orchidrec import-recbole-knowledge
          --kg examples/recbole-knowledge-synthetic.kg
          --link examples/recbole-knowledge-synthetic.link
          --inter examples/recbole-synthetic.inter --minimum-rating 4
          --side-features artifacts/ci-recbole-side.json
          --output artifacts/ci-recbole-knowledge.json
      - name: Validate local RecBole social edge interchange
        run: >-
          uv run --locked orchidrec import-recbole-network
          --net examples/recbole-network-synthetic.net
          --inter examples/recbole-synthetic.inter --minimum-rating 4
          --output artifacts/ci-recbole-network.json
      - name: Run EASE experiment smoke test
        run: uv run --locked orchidrec run examples/ease_config.json
      - name: Run training-only side-feature FM experiment smoke test
        run: uv run --locked orchidrec run examples/side_feature_fm_config.json
      - name: Run second-order sequential backoff experiment smoke test
        run: uv run --locked orchidrec run examples/sequential_backoff_config.json
      - name: Run sampled evaluation smoke test
        run: uv run --locked orchidrec run examples/sampled_config.json
      - name: Run typed feature pipeline smoke test
        run: >-
          uv run --locked orchidrec fit-features
          --input examples/features-train.json
          --output artifacts/ci-feature-pipeline.json
      - name: Transform validation features with frozen training state
        run: >-
          uv run --locked orchidrec transform-features
          --pipeline artifacts/ci-feature-pipeline.json
          --input examples/features-validation.json
          --output artifacts/ci-features-validation-encoded.json
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run shared-split benchmark smoke test
        run: uv run --locked orchidrec benchmark examples/benchmark_config.json --output-dir artifacts/ci-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run sequential backoff benchmark smoke test
        run: uv run --locked orchidrec benchmark examples/sequential_backoff_benchmark_config.json --output-dir artifacts/ci-sequential-backoff-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run RecBole interaction benchmark smoke test
        run: uv run --locked orchidrec benchmark examples/recbole-benchmark-config.json --output-dir artifacts/ci-recbole-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run bounded atomic dataset registry smoke test
        run: uv run --locked orchidrec register-recbole-datasets --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --registry artifacts/ci-registries
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run sampled shared-split benchmark smoke test
        run: uv run --locked orchidrec benchmark examples/sampled_benchmark_config.json --output-dir artifacts/ci-sampled-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run sampled tuned benchmark provenance smoke test
        run: uv run --locked orchidrec benchmark examples/sampled_tuned_benchmark_config.json --output-dir artifacts/ci-sampled-tuned-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Install quality tools
        run: uv sync --locked --extra dev
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --locked ruff check src tests tools examples
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --locked ruff format --check src tests tools examples
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --locked mypy src
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --locked bandit -q -c pyproject.toml -r src
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv audit --locked
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run --locked coverage run -m unittest discover -s tests
          uv run --locked coverage report
          uv run --locked coverage json -o /tmp/orchidrec-coverage.json
          uv run --locked python tools/check_branch_coverage.py /tmp/orchidrec-coverage.json
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run --locked python -m build --no-isolation
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Verify the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .ci-wheel-check
          .ci-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .ci-wheel-check/bin/python -c "import orchidrec; print(orchidrec.__version__)"
          .ci-wheel-check/bin/orchidrec --help
          .ci-wheel-check/bin/orchidrec run examples/ease_config.json
          .ci-wheel-check/bin/orchidrec run examples/side_feature_fm_config.json
          .ci-wheel-check/bin/orchidrec run examples/sequential_backoff_config.json
          .ci-wheel-check/bin/orchidrec recommend artifacts/side-feature-fm/model.json u1 --k 3
          .ci-wheel-check/bin/orchidrec dataset-summary examples/recbole-synthetic.inter --format recbole-inter --minimum-rating 4
          .ci-wheel-check/bin/orchidrec import-recbole-features --user examples/recbole-side-synthetic.user --item examples/recbole-side-synthetic.item --output artifacts/ci-wheel-recbole-side.json
          .ci-wheel-check/bin/orchidrec import-recbole-knowledge --kg examples/recbole-knowledge-synthetic.kg --link examples/recbole-knowledge-synthetic.link --inter examples/recbole-synthetic.inter --minimum-rating 4 --side-features artifacts/ci-wheel-recbole-side.json --output artifacts/ci-wheel-recbole-knowledge.json
          .ci-wheel-check/bin/orchidrec import-recbole-network --net examples/recbole-network-synthetic.net --inter examples/recbole-synthetic.inter --minimum-rating 4 --output artifacts/ci-wheel-recbole-network.json
          .ci-wheel-check/bin/orchidrec register-recbole-datasets --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --registry artifacts/ci-wheel-registries
          .ci-wheel-check/bin/orchidrec verify-recbole-registry --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --record "$(find artifacts/ci-wheel-registries -maxdepth 1 -name '*.json' -print -quit)"
          .ci-wheel-check/bin/orchidrec fit-features --input examples/features-train.json --output artifacts/ci-wheel-feature-pipeline.json
          .ci-wheel-check/bin/orchidrec transform-features --pipeline artifacts/ci-wheel-feature-pipeline.json --input examples/features-validation.json --output artifacts/ci-wheel-features-encoded.json
