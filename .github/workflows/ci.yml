name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile source
        run: python -m compileall -q src tests examples
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run installed CLI smoke test
        run: orchidrec demo --output-dir artifacts/ci-demo
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Run shared-split benchmark smoke test
        run: orchidrec benchmark examples/benchmark_config.json --output-dir artifacts/ci-benchmark
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        name: Install quality tools
        run: python -m pip install ".[dev]"
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: ruff check src tests examples
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: mypy src
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: coverage run -m unittest discover -s tests && coverage report
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m build
