name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest-release:
    if: github.repository == 'appleweiping/OrchidRec'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.31"
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --extra dev
      - name: Run static quality and security gates
        shell: bash
        run: |
          uv run --locked python -m compileall -q src tests tools examples
          uv run --locked ruff check src tests tools examples
          uv run --locked ruff format --check src tests tools examples
          uv run --locked mypy src
          uv run --locked bandit -q -c pyproject.toml -r src
          uv audit --locked
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Run release tests
        shell: bash
        run: |
          uv run --locked coverage run -m unittest discover -s tests
          uv run --locked coverage report
          uv run --locked coverage json -o /tmp/orchidrec-coverage.json
          uv run --locked python tools/check_branch_coverage.py /tmp/orchidrec-coverage.json
      - name: Build distributions
        run: uv run --locked python -m build --no-isolation
      - name: Verify the wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-wheel-check
          .release-wheel-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .release-wheel-check/bin/python -c "import orchidrec; assert orchidrec.__version__ == '${GITHUB_REF_NAME#v}'"
          .release-wheel-check/bin/orchidrec --version
          .release-wheel-check/bin/orchidrec dataset-summary examples/recbole-synthetic.inter --format recbole-inter --minimum-rating 4
          .release-wheel-check/bin/orchidrec import-recbole-features --user examples/recbole-side-synthetic.user --item examples/recbole-side-synthetic.item --output artifacts/release-wheel-recbole-side.json
          .release-wheel-check/bin/orchidrec import-recbole-knowledge --kg examples/recbole-knowledge-synthetic.kg --link examples/recbole-knowledge-synthetic.link --inter examples/recbole-synthetic.inter --minimum-rating 4 --side-features artifacts/release-wheel-recbole-side.json --output artifacts/release-wheel-recbole-knowledge.json
          .release-wheel-check/bin/orchidrec import-recbole-network --net examples/recbole-network-synthetic.net --inter examples/recbole-synthetic.inter --minimum-rating 4 --output artifacts/release-wheel-recbole-network.json
          .release-wheel-check/bin/orchidrec register-recbole-datasets --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --registry artifacts/release-wheel-registries
          .release-wheel-check/bin/orchidrec verify-recbole-registry --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --record "$(find artifacts/release-wheel-registries -maxdepth 1 -name '*.json' -print -quit)"
          .release-wheel-check/bin/orchidrec run examples/ease_config.json
          .release-wheel-check/bin/orchidrec fit-features --input examples/features-train.json --output artifacts/release-wheel-feature-pipeline.json
          .release-wheel-check/bin/orchidrec transform-features --pipeline artifacts/release-wheel-feature-pipeline.json --input examples/features-validation.json --output artifacts/release-wheel-features-encoded.json
      - name: Verify the source distribution in a clean environment
        shell: bash
        run: |
          python -m venv .release-sdist-check
          .release-sdist-check/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.tar.gz
          .release-sdist-check/bin/python -c "import orchidrec; assert orchidrec.__version__ == '${GITHUB_REF_NAME#v}'"
          .release-sdist-check/bin/orchidrec --version
          .release-sdist-check/bin/orchidrec dataset-summary examples/recbole-synthetic.inter --format recbole-inter --minimum-rating 4
          .release-sdist-check/bin/orchidrec import-recbole-features --user examples/recbole-side-synthetic.user --item examples/recbole-side-synthetic.item --output artifacts/release-sdist-recbole-side.json
          .release-sdist-check/bin/orchidrec import-recbole-knowledge --kg examples/recbole-knowledge-synthetic.kg --link examples/recbole-knowledge-synthetic.link --inter examples/recbole-synthetic.inter --minimum-rating 4 --side-features artifacts/release-sdist-recbole-side.json --output artifacts/release-sdist-recbole-knowledge.json
          .release-sdist-check/bin/orchidrec import-recbole-network --net examples/recbole-network-synthetic.net --inter examples/recbole-synthetic.inter --minimum-rating 4 --output artifacts/release-sdist-recbole-network.json
          .release-sdist-check/bin/orchidrec register-recbole-datasets --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --registry artifacts/release-sdist-registries
          .release-sdist-check/bin/orchidrec verify-recbole-registry --dataset alpha=examples/registry/alpha --minimum-rating alpha=3 --dataset beta=examples/registry/beta --record "$(find artifacts/release-sdist-registries -maxdepth 1 -name '*.json' -print -quit)"
          .release-sdist-check/bin/orchidrec run examples/ease_config.json
          .release-sdist-check/bin/orchidrec fit-features --input examples/features-train.json --output artifacts/release-sdist-feature-pipeline.json
          .release-sdist-check/bin/orchidrec transform-features --pipeline artifacts/release-sdist-feature-pipeline.json --input examples/features-validation.json --output artifacts/release-sdist-features-encoded.json
      - name: Generate runtime dependency SBOM
        shell: bash
        run: >-
          uv export --locked --no-dev --format cyclonedx1.5
          --output-file "dist/orchidrec-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort) > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchidrec-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --generate-notes
          --title "OrchidRec ${GITHUB_REF_NAME#v}"
